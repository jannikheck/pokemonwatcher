name: Pokemon Restock Watcher

on:
  schedule:
    # Alle 15 Min, bewusst NICHT auf die volle Stunde gelegt (dort ist GitHubs
    # Zeitplaner am staerksten ueberlastet). Jeder Lauf prueft dann aber nicht
    # nur einmal, sondern laeuft ~14 Min im Dauertakt weiter (siehe run-Schritt)
    # -> zusammen ergibt das nahezu lueckenlose Ueberwachung.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}          # manuelles Anstossen erlaubt

permissions:
  contents: write                # noetig, um den aktualisierten State zu committen

concurrency:
  group: restock-watcher
  cancel-in-progress: false      # laufenden Lauf nicht abbrechen; naechster wartet

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20          # Sicherheitsnetz ueber der ~14-Min-Laufzeit
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install requests

      - name: Watcher ausfuehren
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # OEFFENTLICHES REPO -> Actions-Minuten sind gratis, darum der Dauertakt:
        # ~14 Min lang alle 30 Sekunden ein kompletter Durchlauf ueber alle Shops.
        # 30s ist der sinnvolle Boden - schneller riskiert IP-Sperren der Shops.
        # (Bei einem PRIVATEN Repo waere das teuer -> dann stattdessen einfach:
        #   run: python pokemon_restock_watcher.py )
        run: python pokemon_restock_watcher.py --max-runtime 14 --interval 30

      - name: Neuen Stand speichern (state committen)
        run: |
          git config user.name "restock-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add watcher_state.json
          if git diff --staged --quiet; then
            echo "Keine Aenderungen am State - nichts zu committen."
          else
            git commit -m "Stand aktualisiert [skip ci]"
            git pull --rebase --autostash origin main || true
            git push || echo "Push fehlgeschlagen - naechster Lauf holt es nach."
          fi
          # Nebeneffekt: dieser Commit zaehlt als Repo-Aktivitaet und verhindert,
          # dass GitHub den Zeitplan nach 60 Tagen Inaktivitaet abschaltet.
