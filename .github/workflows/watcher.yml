name: Pokemon Restock Watcher

on:
  schedule:
    - cron: "*/15 * * * *"   # alle 15 Minuten. GitHub garantiert keine
                              # exakte Puenktlichkeit, kleine Verzoegerungen
                              # (paar Minuten) sind normal.
  workflow_dispatch:          # erlaubt manuelles Anstossen über den "Run workflow"-Button

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install requests beautifulsoup4

      - name: Watcher ausfuehren
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pokemon_restock_watcher_v2.py

      - name: Neuen Stand speichern (state committen)
        run: |
          git config user.name "restock-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add watcher_state.json
          git diff --staged --quiet || git commit -m "Stand aktualisiert [skip ci]"
          git push
