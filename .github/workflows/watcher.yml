name: Pokemon Restock Watcher

on:
  schedule:
    - cron: "*/15 * * * *"   # alle 15 Min (GitHub kann Laeufe unter Last verzoegern)
  workflow_dispatch:          # manuelles Anstossen erlaubt

# WICHTIG: ohne Schreibrechte kann der aktualisierte State nicht zurueckgepusht
# werden -> dann meldet jeder Lauf alles erneut als "neu".
permissions:
  contents: write

# Verhindert, dass sich zwei Laeufe ueberschneiden und den State zerschiessen.
# cancel-in-progress: false -> ein laufender Commit wird nicht mittendrin gekillt.
concurrency:
  group: restock-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install requests beautifulsoup4

      - name: Watcher ausfuehren
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pokemon_restock_watcher_v2.py

      - name: Neuen Stand speichern (state committen)
        run: |
          git config user.name "restock-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add watcher_state.json
          if git diff --staged --quiet; then
            echo "Keine Aenderungen am State - nichts zu committen."
          else
            git commit -m "Stand aktualisiert [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
